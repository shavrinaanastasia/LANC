[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agent-language-geometry"
version = "0.1.0"
description = "Reproducible MVP for two-agent language geometry experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "PyYAML==6.0.1",
  "scipy==1.13.1",
  "scikit-learn==1.5.1",
  "torch==2.3.1",
  "transformers==4.43.3",
  "sentence-transformers==3.0.1",
  "editables==0.5",
  "pyarrow==16.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2", "ruff==0.5.0"]
report = ["reportlab==4.2.2"]

[project.scripts]
agent-language-geometry = "agent_language_geometry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_language_geometry"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
